<!DOCTYPE html>
<html>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
<body>
	<h2>Demo Vue.js Binding</h2>
	<div id="app">
		{{ message }}
	</div>

	<p>
		<button onclick="myFunction()">Click Me!</button>
	</p>

	<script>
	    // create vue object
		var myObject = new Vue({
			el: '#app',
			data: {message: 'Hello students !!!'}
		})

		// create new function
		function myFunction() {
			myObject.message = "My name is Semmy Wellem Taju";
		}
	</script>

</body>
</html>
