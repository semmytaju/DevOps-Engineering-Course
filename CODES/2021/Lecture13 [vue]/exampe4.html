<!DOCTYPE html>
<html>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
<body>
	<h2>Demo Vue.js Loop Binding</h2>
	<div id="app">
	  <ul>
		<li v-for="x in todos">
		  {{ x.text }}
		</li>
	  </ul>
	</div>

	<script>
	    // create vue object
		myObject = new Vue({
		  el: '#app',
		  data: {
			todos: [
			  { text: 'Learn JavaScript' },
			  { text: 'Learn Vue.js' },
			  { text: 'Build Something Awesome' }
			]
		  }
		})
	</script>
</body>
</html>
