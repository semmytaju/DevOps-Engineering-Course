<!DOCTYPE html>
<html>
<head>
	<title>jQuery Snake</title>
	<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
	<script src="snake-scripts.js"></script>
	<link rel="stylesheet" href="snake-style.css">
</head>
<body>
	<div id="container">
		<div id="gameover">
			Game over!
			<br>
			Your score is <span id="final"></span>
			<br>
			<a onClick="window.location.reload()" href="#">Click To Play Again</a>
		</div>
		<canvas id="myCanvas" width="600" height="450"> 
			Sorry, this browser does not support the canvas feature.
		</canvas>
		<div id="score">
			<div>Current Score:<span id="current">0</span>
			</div>
			<div>High Score:<span id="highest">3</span>
			</div>
		</div>
	</div>
</body>
</html>
